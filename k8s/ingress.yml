apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codespace
  annotations: 
    nginx.ingress.kubernetes.io/proxy-read-timeout: "6000"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "6000"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "6000"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/websocket-services: "router-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    
  labels:
    app.kubernetes.io/name: codespace
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/api/sandbox"
        backend:
          service:
            name: sandbox-service
            port: 
              number: 80
  - http:
      paths:
      - pathType: Prefix
        path: "/api/ai"
        backend:
          service:
            name: ai-service
            port: 
              number: 80

  - host: "*.preview.localhost"
    http:
      paths:
        - backend:
            service:
              name: router-service
              port:
                number: 80
          pathType: Prefix
          path: '/'

  - host: "*.agent.localhost"
    http:
      paths:
        - backend:
            service:
              name: router-service
              port:
                number: 80
          pathType: Prefix
          path: '/'